name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

# 同一个分支连续推送时，取消上一轮还在跑的任务，避免旧提交的结果覆盖新提交
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 判定「今天」的体检/结算逻辑依赖本地日期；固定时区，避免 CI(UTC) 与开发机(CST)
  # 在 00:00–08:00 之间跨天，导致同一份数据判出不同结论
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 已在 CI 上跑通过（后端 239 条全绿），保持不动；本地换版本前先确认
          # 依赖在对应版本上有 wheel
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑测试
        # 用 python -m pytest 而不是裸 pytest：-m 会把 backend/ 加进 sys.path，
        # 否则 `import app` 找不到包
        run: python -m pytest tests -q

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vite 8 / @vitejs/plugin-vue 6 要求 ^20.19.0 || >=22.12.0；
          # "20" 会取 20.19.x，满足要求，保持不动
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      # 类型检查单独一步，失败时能一眼看出是类型问题还是打包问题
      - name: 类型检查
        run: npm run type-check

      - name: 构建
        run: npx vite build
