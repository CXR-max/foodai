<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>识膳智行 · 移动端实机预览</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #eef1f6;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    color: #1f2937;
  }
  .head { text-align: center; margin-bottom: 16px; }
  .head h1 { font-size: 17px; margin: 0 0 6px; font-weight: 600; }
  .head p { margin: 0; font-size: 12.5px; color: #6b7280; line-height: 1.7; }
  .head code { background: #fff; border: 1px solid #e3e8ef; border-radius: 4px; padding: 1px 5px; font-size: 12px; }

  .tabs {
    display: flex; gap: 6px; background: #fff; border: 1px solid #e3e8ef;
    padding: 5px; border-radius: 12px; margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(16,24,40,.05);
  }
  .tabs button {
    border: 0; background: transparent; padding: 8px 16px; border-radius: 8px;
    font-size: 13.5px; color: #4b5563; cursor: pointer; font-family: inherit;
    transition: all .15s;
  }
  .tabs button:hover { background: #f3f5f9; }
  .tabs button.on { background: #2f6bff; color: #fff; font-weight: 600; }

  /* 手机外壳 */
  .phone {
    position: relative;
    width: 414px; height: 868px;
    background: #0f172a;
    border-radius: 44px;
    padding: 10px;
    box-shadow: 0 24px 60px rgba(15,23,42,.28), 0 0 0 1px rgba(15,23,42,.6);
  }
  .screen {
    width: 100%; height: 100%;
    border-radius: 36px;
    overflow: hidden;
    background: #fff;
    position: relative;
  }
  .screen iframe {
    width: 394px; height: 848px; border: 0; display: block;
    transform-origin: 0 0;
  }
  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 26px; background: #0f172a;
    border-radius: 0 0 16px 16px; z-index: 5;
  }
  .hint { margin-top: 18px; font-size: 12px; color: #6b7280; text-align: center; line-height: 1.8; }
  .hint b { color: #374151; }
</style>
</head>
<body>
  <div class="head">
    <h1>识膳智行 · 移动端五大模块</h1>
    <p>真实运行中的页面（前端 5173 + 后端 8000）。登录账号 <code>demo_mobile</code> / <code>demo123456</code></p>
  </div>

  <div class="tabs" id="tabs">
    <button data-path="/m/plan">计划</button>
    <button data-path="/m/schedule" class="on">日程</button>
    <button data-path="/m/sport">运动</button>
    <button data-path="/m/community">社区</button>
    <button data-path="/m/me">我的</button>
  </div>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <iframe id="frame" src="http://localhost:5173/m/schedule" allow="clipboard-read; clipboard-write"></iframe>
    </div>
  </div>

  <div class="hint">
    <b>提示：</b>第一次需要在手机里登录一次，之后切换标签不会掉登录态。<br />
    想在自己浏览器里看，直接打开 <b>http://localhost:5173</b> 并按 <b>F12 → Ctrl+Shift+M</b> 切手机模式。
  </div>

<script>
  const frame = document.getElementById('frame')
  const tabs = document.getElementById('tabs')
  tabs.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-path]')
    if (!btn) return
    tabs.querySelectorAll('button').forEach(b => b.classList.remove('on'))
    btn.classList.add('on')
    frame.src = 'http://localhost:5173' + btn.dataset.path
  })
</script>
</body>
</html>
